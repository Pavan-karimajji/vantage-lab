# Per-project x per-part toolchain/platform mapping for vantage-lab (the test
# bench of Vantage). No private build structure: the generated lab components
# are shared libraries built under src/platform/lab_sil, exactly the shape the
# shared recipe already gives a SIL component (R-BUILD-1, R-VAR-3).
build_subdir: src/platform/lab_sil

recipe:
  type: shared-library

variants:
  base:
    requires:
      - adas-interfaces/1.1.0
      - adas-shared-config/1.0.0
      - protobuf/3.21.12
    sil:
      platforms:
        - build: vs2026
        - build: ubuntu_gcc

# The fake car and the generator (Python, src/lab_tools). Lock regenerated by
# `python scripts/lock_python_env.py vantage-lab lab` (superproject root), never hand-edited.
python_envs:
  lab:
    python: "3.12"
    intent: pyproject.toml
    lock: requirements.lock
    default: true
    package: .
    extras: [dev]
