topology: data_triggered
seed: 1
duration_ms: 2000
sources:
  - {name: X, period_ms: 30}
  - {name: Y, period_ms: 20}
components:
  - {name: T, trigger: in_X, inputs: [{producer: X}, {producer: Y}]}
scenarios:
  - name: base
    resim:
      - {name: by_control, trigger: {T: control}}    # a run per recorded control
      - {name: by_data, trigger: {T: in_X}}          # a run per in_X sample, as the car started it
  - name: renumber
    expect: diverges
    car: {counter_jump: [{source: X, at_counter: 10, by: 1000}], renumber: [T]}
    resim: [{name: by_data, trigger: {T: in_X}}]
