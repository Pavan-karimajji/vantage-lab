topology: feedback
seed: 1
duration_ms: 2000
sources:
  - {name: X, period_ms: 10}
components:
  # B is declared before A, so at each shared instant B has run and logged when A starts: only
  # `previous_cycle` keeps A from reading that same-instant B (which itself read A's last output).
  - {name: B, period_ms: 20, inputs: [{producer: A}]}
  - name: A
    period_ms: 20
    inputs: [{producer: X}, {producer: B, previous_cycle: true}]
scenarios:
  - name: base
    resim:
      - {name: cut_b, measured: [B]}          # A reads the recorded B of the previous cycle
      - {name: all_simulated}                 # A reads the live B of the previous cycle
