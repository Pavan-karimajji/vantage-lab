topology: late_consumer
seed: 2
duration_ms: 1000
sources:
  - {name: X, period_ms: 10}
components:
  - {name: P, period_ms: 20, phase_ms: 22, inputs: [{producer: X}]}
  - {name: Q, period_ms: 20, phase_ms: 20, jitter_ms: 8, inputs: [{producer: P}]}
scenarios:
  - name: base
    resim:
      - {name: cut_p, measured: [P]}          # Q reads the recorded P, sample after its control
      - {name: all_simulated}                 # Q waits for the live P
