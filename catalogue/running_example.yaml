topology: running_example
seed: 1
duration_ms: 3000
sources:
  - {name: X, period_ms: 10}
  - {name: Y, period_ms: 25, jitter_ms: 3}
  - {name: Z, period_ms: 50, jitter_ms: 5}
components:
  - {name: A, period_ms: 20, jitter_ms: 2, inputs: [{producer: X}]}
  - name: B
    period_ms: 40
    phase_ms: 60
    jitter_ms: 4
    memory: true
    inputs: [{producer: A}, {producer: X}, {producer: Y}, {producer: Z}]
  - {name: C, period_ms: 20, inputs: [{producer: X}]}
  - {name: D, period_ms: 20, jitter_ms: 2, memory: true, inputs: [{producer: C}]}
  - {name: E, period_ms: 30, jitter_ms: 3, inputs: [{producer: Y}]}
scenarios:
  - name: base
    resim:
      - {name: cut_c, measured: [C]}          # A, B, D, E simulated; C measured
      - {name: all_simulated}
      - {name: jump, measured: [C], jump_to_ms: 1500}
      - {name: hang, config: {B: {set: {LAB_B_HANG_AFTER_RUNS: 5}}}}     # needs the supervisor (LAB-53)
      - {name: crash, config: {B: {set: {LAB_B_CRASH_AFTER_RUNS: 5}}}}   # needs the supervisor (LAB-53)
  - name: restart
    car: {restart: [{component: D, at_run: 30}]}
    resim: [{name: replay, measured: [C]}]
  - name: fault
    car:
      silent:  [{source: Z, from_ms: 400,  for_ms: 920}]
      invalid: [{source: Z, from_ms: 1320, for_ms: 800}]
    resim: [{name: replay}]
  # Drills (G4; ARCH section 12), section 6.2.
  - name: missing_sample
    recording:
      drop_sample:
        - {port: source.Y, counter: 20}
        - {port: source.Y, counter: 21}
        - {port: source.Y, counter: 22}
    resim: [{name: all_simulated}]
  - name: missing_run
    recording:
      drop_sample:
        - {port: source.Y, counter: 30}
        - {port: source.Y, counter: 31}
        - {port: source.Y, counter: 32}
        - {port: source.Y, counter: 33}
        - {port: source.Y, counter: 34}
        - {port: source.Y, counter: 35}
        - {port: source.Y, counter: 36}
        - {port: source.Y, counter: 37}
        - {port: source.Y, counter: 38}
        - {port: source.Y, counter: 39}
    resim: [{name: all_simulated}]
  - name: no_ref_sync
    expect: diverges
    recording: {drop_ref_sync: all}
    resim: [{name: all_simulated}]
  - name: counter_jump
    car: {counter_jump: [{source: X, at_counter: 50, by: 1000}]}
    resim: [{name: all_simulated}]
